name: Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # First job: Build shared Kotlin Multiplatform code (same as build.yml)
  shared-build:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Generate cache key
      id: cache-key
      run: |
        # Create a cache key based on shared module files and gradle files
        HASH=$(find shared shared-core -name "*.kt" -o -name "*.kts" -o -name "*.gradle*" | sort | xargs cat | sha256sum | cut -d' ' -f1)
        GRADLE_HASH=$(find . -name "gradle-wrapper.properties" -o -name "build.gradle.kts" -o -name "settings.gradle.kts" | sort | xargs cat | sha256sum | cut -d' ' -f1)
        KEY="shared-kmp-${HASH}-${GRADLE_HASH}"
        echo "key=${KEY}" >> $GITHUB_OUTPUT
        echo "Generated cache key: ${KEY}"
        
    - name: Cache Kotlin Native dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.konan/dependencies
          ~/.konan/kotlin-native-prebuilt-linux-*
        key: ${{ runner.os }}-kotlin-native-${{ hashFiles('shared/build.gradle.kts', 'shared-core/build.gradle.kts') }}
        restore-keys: |
          ${{ runner.os }}-kotlin-native-
        
    - name: Cache Gradle and KMP shared build
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/kotlin-dsl
          shared/build
          shared-core/build
          build/kotlin-build-cache
          build/kotlin
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          shared-kmp-
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Shared Kotlin Multiplatform modules
      run: |
        echo "Building shared KMP modules for release..."
        ./gradlew :shared:assembleRelease :shared-core:assembleRelease --stacktrace --no-daemon --build-cache
        echo "Shared KMP release build completed"
        
    - name: Upload shared build cache
      uses: actions/upload-artifact@v4
      with:
        name: shared-build-cache-release
        path: |
          shared/build
          shared-core/build
        retention-days: 1

  # Release build job - depends on shared-build
  release:
    runs-on: ubuntu-latest
    needs: shared-build
    permissions:
      contents: write  # Required for creating releases
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Android SDK and build tools
      uses: actions/cache@v4
      with:
        path: |
          ~/.android/avd
          ~/.android/adb*
          ${{ env.ANDROID_HOME }}/platforms
          ${{ env.ANDROID_HOME }}/platform-tools
          ${{ env.ANDROID_HOME }}/build-tools
          ${{ env.ANDROID_HOME }}/ndk
        key: ${{ runner.os }}-android-sdk-${{ hashFiles('composeApp/build.gradle.kts') }}
        restore-keys: |
          ${{ runner.os }}-android-sdk-
      
    - name: Restore Gradle and KMP shared build cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/kotlin-dsl
          shared/build
          shared-core/build
          build/kotlin-build-cache
          build/kotlin
        key: ${{ needs.shared-build.outputs.cache-key }}
        restore-keys: |
          shared-kmp-
          ${{ runner.os }}-gradle-
          
    - name: Download shared build cache
      uses: actions/download-artifact@v4
      with:
        name: shared-build-cache-release
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Generate version info
      id: version
      run: |
        # Generate version based on date and commit
        DATE=$(date '+%Y%m%d')
        SHORT_SHA=$(git rev-parse --short HEAD)
        VERSION="v1.0.${DATE}.${SHORT_SHA}"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "version_code=$(date '+%Y%m%d%H')" >> $GITHUB_OUTPUT
        echo "Generated version: ${VERSION}"
        
    - name: Build Release APK (using cached shared modules)
      env:
        VERSION_NAME: ${{ steps.version.outputs.version }}
        VERSION_CODE: ${{ steps.version.outputs.version_code }}
      run: |
        echo "Building release APK using cached shared modules..."
        ./gradlew :composeApp:assembleRelease --stacktrace --no-daemon --build-cache
      
    - name: Generate debug keystore for APK signing
      run: |
        # Create .android directory if it doesn't exist
        mkdir -p ~/.android
        
        # Generate debug keystore if it doesn't exist
        if [ ! -f ~/.android/debug.keystore ]; then
          echo "Generating debug keystore for APK signing..."
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Debug keystore generated successfully"
        else
          echo "Debug keystore already exists"
        fi
        
    - name: Prepare signed APK
      env:
        VERSION_NAME: ${{ steps.version.outputs.version }}
      run: |
        # The APK should now be signed and located at composeApp-release.apk
        APK_PATH="composeApp/build/outputs/apk/release/composeApp-release.apk"
        FINAL_APK_PATH="composeApp/build/outputs/apk/release/mountainspotter-${{ steps.version.outputs.version }}.apk"
        
        if [ -f "$APK_PATH" ]; then
          cp "$APK_PATH" "$FINAL_APK_PATH"
          echo "Signed APK prepared: $FINAL_APK_PATH"
          
          # Verify APK is signed
          echo "Verifying APK signature..."
          aapt dump badging "$FINAL_APK_PATH" | head -5
        else
          echo "Error: Signed APK not found at $APK_PATH"
          ls -la composeApp/build/outputs/apk/release/
          exit 1
        fi
        
    - name: Create Release
      uses: softprops/action-gh-release@v2.3.2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Mountain Spotter ${{ steps.version.outputs.version }}
        body: |
          ## Mountain Spotter Release ${{ steps.version.outputs.version }}
          
          **What's New:**
          - Automated release from commit ${{ github.sha }}
          - Built on ${{ github.event.head_commit.timestamp }}
          
          **Download:**
          - Android APK: See attachments below
          
          **Installation:**
          - Download the APK file
          - Enable "Install from unknown sources" on your Android device
          - Install the APK file
          
          **Commit:** ${{ github.sha }}
          **Author:** ${{ github.event.head_commit.author.name }}
          **Message:** ${{ github.event.head_commit.message }}
        files: "composeApp/build/outputs/apk/release/mountainspotter-${{ steps.version.outputs.version }}.apk"
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: false